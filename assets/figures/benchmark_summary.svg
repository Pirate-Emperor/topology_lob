<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
<title id="title">FI-2010 A100 holdout: fixed Focal Loss information coefficient</title>
<desc id="desc">A standard white-background chart using blue and orange bars, thin grey grid lines and a dashed target line. It shows Pearson and Rank Information Coefficient for each of three held-out FI-2010 files. Every bar is above the 0.064 target.</desc>
<rect width="1000" height="600" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#222}
.title{font-size:28px;font-weight:600}
.sub{font-size:16px;fill:#666}
.axis{stroke:#333}
.grid{stroke:#e6e6e6}
.pearson{fill:#1f77b4}
.rank{fill:#ff7f0e}
.small{font-size:14px;fill:#555}
.value{font-size:14px;fill:#333}
</style>
<text x="40" y="50" class="title">FI-2010 A100 holdout: fixed Focal Loss IC</text>
<text x="40" y="78" class="sub">Pearson and Rank IC by held-out file · target = 0.064 · pooled Pearson IC = 0.151939</text>
<rect x="665" y="103" width="16" height="12" class="pearson"/><text x="690" y="114" class="small">Pearson IC</text>
<rect x="795" y="103" width="16" height="12" class="rank"/><text x="820" y="114" class="small">Rank IC</text>
<line x1="120" y1="500" x2="940" y2="500" class="axis"/>
<line x1="120" y1="195" x2="120" y2="500" class="axis"/>
<line x1="120" y1="423.75" x2="940" y2="423.75" class="grid"/>
<line x1="120" y1="347.5" x2="940" y2="347.5" class="grid"/>
<line x1="120" y1="271.25" x2="940" y2="271.25" class="grid"/>
<line x1="120" y1="195" x2="940" y2="195" class="grid"/>
<text x="108" y="505" text-anchor="end" class="small">0.00</text>
<text x="108" y="428.75" text-anchor="end" class="small">0.05</text>
<text x="108" y="352.5" text-anchor="end" class="small">0.10</text>
<text x="108" y="276.25" text-anchor="end" class="small">0.15</text>
<text x="108" y="200" text-anchor="end" class="small">0.20</text>
<line x1="120" y1="402.4" x2="940" y2="402.4" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
<rect x="836" y="384" width="99" height="23" fill="white"/>
<text x="841" y="400" class="small">Target = 0.064</text>
<!-- Day 8 -->
<rect x="190" y="256.21" width="62" height="243.79" class="pearson"/>
<rect x="260" y="252.42" width="62" height="247.58" class="rank"/>
<text x="221" y="244" text-anchor="middle" class="value">0.1599</text>
<text x="291" y="240" text-anchor="middle" class="value">0.1623</text>
<!-- Day 9 -->
<rect x="445" y="285.27" width="62" height="214.73" class="pearson"/>
<rect x="515" y="278.75" width="62" height="221.25" class="rank"/>
<text x="476" y="273" text-anchor="middle" class="value">0.1405</text>
<text x="546" y="266" text-anchor="middle" class="value">0.1447</text>
<!-- Day 10 -->
<rect x="700" y="251.78" width="62" height="248.22" class="pearson"/>
<rect x="770" y="256.90" width="62" height="243.10" class="rank"/>
<text x="731" y="239" text-anchor="middle" class="value">0.1628</text>
<text x="801" y="244" text-anchor="middle" class="value">0.1594</text>
<text x="256" y="529" text-anchor="middle" class="small">Day 8</text>
<text x="511" y="529" text-anchor="middle" class="small">Day 9</text>
<text x="766" y="529" text-anchor="middle" class="small">Day 10</text>
<text x="500" y="570" text-anchor="middle" class="small">Fixed 10-event horizon · 50-event purge · measured on A100 run #13</text>
</svg>