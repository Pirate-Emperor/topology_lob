<title id="title">Topology LOB — FI-2010 A100 validation</title>
<desc id="desc">All 25 steps passed on the A100 runner. The fixed Focal Loss model reached pooled Pearson IC 0.15194, all test days cleared target 0.064, and CUDA FFD reached 61.34 million events per second with CPU parity error 2.22e-15. The five-fold selected regressor reached Pearson IC 0.21495.</desc>
