name: topology-lob-fi2010

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/topology-lob-fi2010.yml"
      - "scripts/run_fi2010_benchmark.py"
      - "scripts/run_fi2010_ablation.py"
      - "scripts/run_fi2010_ic_sweep.py"
      - "scripts/run_fi2010_return_regression.py"
      - "scripts/run_fi2010_focal_horizon_selection.py"
      - "fi2010.py"
      - "topology_lob.py"
      - "tests/**"

permissions:
  contents: read

jobs:
  fi2010:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned research environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[tda,dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Download public FI-2010 Decimal-Precision benchmark
        run: |
          mkdir -p /tmp/fi2010
          curl -L --fail --retry 3 -o /tmp/fi2010/data.zip https://raw.githubusercontent.com/zcakhaa/DeepLOB-Deep-Convolutional-Neural-Networks-for-Limit-Order-Books/master/data/data.zip
          unzip -q /tmp/fi2010/data.zip -d /tmp/fi2010
          find /tmp/fi2010 -maxdepth 3 -type f -name '*DecPre*' -print
      - name: Run real-data TDA benchmark
        run: |
          python scripts/run_fi2010_benchmark.py \
            --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt \
            --test \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt \
            --require-gtda --tda-stride 1000 \
            --out results/fi2010_benchmark.json
      - name: Run real-data feature ablation
        run: |
          python scripts/run_fi2010_ablation.py \
            --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt \
            --test \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt \
            --require-gtda --tda-stride 1000 \
            --out results/fi2010_ablation.json
      - name: Run threshold/objective sweep with internal validation
        run: |
          python scripts/run_fi2010_ic_sweep.py \
            --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt \
            --test \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt \
            --require-gtda --tda-stride 1000 \
            --out results/fi2010_ic_sweep.json
      - name: Validate measured target status and save summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("results/fi2010_ic_sweep.json")
          r = json.loads(p.read_text())
          selected = r["heldout_pooled"]["validation_selected"]
          reference = r["heldout_pooled"]["fixed_reference"]
          assert r["internal_validation"]["selected"]["threshold"] in [0.0, 0.0001, 0.00025, 0.0005, 0.001]
          assert selected["rows"] > 0 and reference["rows"] > 0
          assert r["target_metric_status"]["pearson_ic_at_least_0_064"] == (selected["pearson_ic"] >= 0.064)
          assert r["target_metric_status"]["rank_ic_at_least_0_064"] == (selected["rank_ic"] >= 0.064)
          print(json.dumps({
              "selected_config": r["internal_validation"]["selected"],
              "heldout_selected": selected,
              "heldout_fixed_reference": reference,
              "target_metric_status": r["target_metric_status"],
          }, indent=2))
          PY
      - name: Run fixed multi-horizon continuous-return regression
        run: |
          python scripts/run_fi2010_return_regression.py \
            --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt \
            --test \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt \
            --horizons 10 20 30 50 100 200 500 1000 \
            --require-gtda --tda-stride 1000 \
            --out results/fi2010_regression_sweep.json
      - name: Validate regression coverage without selecting on test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("results/fi2010_regression_sweep.json").read_text())
          assert r["tda"]["backend"] == "giotto-tda", r["tda"]
          assert len(r["results"]) == 32, len(r["results"])
          assert set(x["horizon"] for x in r["results"]) == {10, 20, 30, 50, 100, 200, 500, 1000}
          assert set(x["feature_set"] for x in r["results"]) == {"micro_only", "micro_plus_fd", "micro_plus_topology", "full"}
          assert all(x["heldout"]["pooled"]["rows"] > 0 for x in r["results"])
          print(json.dumps({
              "selected_d": r["selected_d"],
              "gpu_used": r["gpu_used"],
              "top_5_heldout_pearson_ic_descriptive_only": r["top_5_heldout_pearson_ic_descriptive_only"],
              "target_pearson_ic_0_064_reached_by_any_fixed_config": r["target_pearson_ic_0_064_reached_by_any_fixed_config"],
              "target_rank_ic_0_064_reached_by_any_fixed_config": r["target_rank_ic_0_064_reached_by_any_fixed_config"],
          }, indent=2))
          PY
      - name: Select Focal Loss horizon on training-only validation
        run: |
          python scripts/run_fi2010_focal_horizon_selection.py \
            --train /tmp/fi2010/Train_Dst_NoAuction_DecPre_CF_7.txt \
            --test \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_7.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_8.txt \
              /tmp/fi2010/Test_Dst_NoAuction_DecPre_CF_9.txt \
            --horizons 10 20 30 50 100 200 500 1000 \
            --require-gtda --tda-stride 1000 \
            --out results/fi2010_focal_horizon_selection.json
      - name: Validate selected Focal model without test-based selection
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("results/fi2010_focal_horizon_selection.json").read_text())
          assert r["candidate_count"] == 32, r["candidate_count"]
          assert r["selected"]["horizon"] in {10, 20, 30, 50, 100, 200, 500, 1000}
          assert r["selected"]["feature_set"] in {"micro_only", "micro_plus_fd", "micro_plus_topology", "full"}
          assert r["selected_test"]["focal"]["rows"] > 0
          assert r["selected_test"]["logloss_control"]["rows"] > 0
          assert r["selected_test_target_status"]["focal_pearson_ic_at_least_0_064"] == (r["selected_test"]["focal"]["pearson_ic"] >= 0.064)
          assert r["selected_test_target_status"]["focal_rank_ic_at_least_0_064"] == (r["selected_test"]["focal"]["rank_ic"] >= 0.064)
          print(json.dumps({
              "selected": r["selected"],
              "selected_test_focal": r["selected_test"]["focal"],
              "selected_test_logloss_control": r["selected_test"]["logloss_control"],
              "target_status": r["selected_test_target_status"],
          }, indent=2))
          PY
      - name: Upload benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: topology-lob-fi2010-results
          path: |
            results/fi2010_benchmark.json
            results/fi2010_ablation.json
            results/fi2010_ic_sweep.json
            results/fi2010_regression_sweep.json
            results/fi2010_focal_horizon_selection.json
