name: topology-lob

permissions:
  contents: write

concurrency:
  group: topology-lob-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tda,dev]"
      - name: Run unit and integration tests
        run: python -m pytest -q
      - name: Run synthetic end-to-end demo with Giotto-TDA
        run: python run.py demo --config configs/demo.json --out /tmp/topology-lob-demo --require-gtda
      - name: Confirm the full topology backend ran
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          metrics = json.loads(Path("/tmp/topology-lob-demo/metrics.json").read_text())
          assert metrics["tda"]["backend"] == "giotto-tda", metrics["tda"]
          print("TDA backend:", metrics["tda"]["backend"])
          print("FFD backend:", metrics["fractional_diff_backend"])
          PY
      - name: Run extended numerical and data experiments
        run: python scripts/generate_evidence.py --events 6000 --out /tmp/topology-lob-evidence --require-gtda
      - name: Validate experiment counts and outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/topology-lob-evidence")
          report = json.loads((root / "experimental_validation.json").read_text())
          assert report["main"]["tda_backend"] == "giotto-tda", report["main"]
          assert report["checks"]["gradient_pass"]
          assert report["checks"]["hessian_pass"]
          assert report["checks"]["all_pass"]
          assert len(report["ablation"]) == 5
          assert len(report["seed_sensitivity"]) == 6
          assert len(report["walk_forward"]) == 5
          for name in ["experimental_validation_dashboard.png", "robustness_dashboard.png", "data_diagnostics_dashboard.png"]:
              assert (root / "figures" / name).is_file(), name
          assert (root / "screenshots" / "report_preview.png").is_file()
          print("Extended experiment checks: PASS")
          PY
      - name: Upload numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-lob-extended-evidence
          path: /tmp/topology-lob-evidence
      - name: Build C++ CPU implementation
        run: |
          cmake -S . -B /tmp/topology-lob-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/topology-lob-build --config Release
      - name: Run C++ fractional-difference benchmark
        run: /tmp/topology-lob-build/fractional_diff_cpu

  refresh-assets:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'main')
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: topology-lob-extended-evidence
          path: /tmp/topology-lob-evidence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install report dependencies
        run: python -m pip install -e .
      - name: Refresh analysis images
        run: |
          python scripts/generate_fi2010_dashboard.py
          cp /tmp/topology-lob-evidence/figures/experimental_validation_dashboard.png assets/figures/experimental_validation_dashboard.png
          cp /tmp/topology-lob-evidence/figures/robustness_dashboard.png assets/figures/robustness_dashboard.png
          cp /tmp/topology-lob-evidence/figures/data_diagnostics_dashboard.png assets/figures/data_diagnostics_dashboard.png
          cp /tmp/topology-lob-evidence/screenshots/report_preview.png assets/screenshots/report_preview.png
          python scripts/validate_assets.py
      - name: Commit refreshed image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/figures assets/screenshots
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "chore: refresh readable experiment reports [skip ci]"
          git push origin "HEAD:${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify built packages
        run: test -n "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -print -quit)"
